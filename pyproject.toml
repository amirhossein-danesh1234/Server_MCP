[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "server-mcp-agent"
version = "0.1.0"
description = "ChatGPT-first, OAuth-protected Linux server administration MCP"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.3.0,<3",
  "PyJWT[crypto]>=2.10,<3",
  "psutil>=6,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
server-mcp = "server_mcp.server:main"
server-mcp-approve = "server_mcp.approvals:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
